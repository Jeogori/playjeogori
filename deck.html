<!DOCTYPE html>

<head>

    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { background-color: #0b0a0d; color: #e3dec9; text-align: center; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        .header-bar { background-color: #131117; padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #c5a880; position: sticky; top: 0; z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .logo-text { font-family: 'Cinzel', serif; font-size: 26px; font-weight: 900; color: #c5a880; letter-spacing: 2px; }
        .youtube-btn { background: linear-gradient(135deg, #9e2a2b, #6e1a1b); color: #ffffff !important; border: 1px solid #c5a880; padding: 10px 22px; font-size: 14px; font-weight: 700; text-decoration: none; letter-spacing: 1px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .main-container { display: flex; max-width: 1200px; margin: 0 auto; padding: 50px 20px; gap: 40px; justify-content: center; align-items: flex-start; text-align: left; }
        .menu-container { display: flex; flex-direction: column; gap: 10px; width: 240px; flex-shrink: 0; }
        .menu-item { background-color: #1c1922; color: #e3dec9; padding: 15px 20px; font-weight: 700; font-size: 16px; text-decoration: none; text-align: left; border-left: 5px solid #36303d; border-top: 1px solid #36303d; border-right: 1px solid #36303d; border-bottom: 1px solid #36303d; border-radius: 0 6px 6px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.2s ease; white-space: nowrap; }
        .menu-item:hover, .menu-item.active { background-color: #9e2a2b; color: #ffffff; border-left: 5px solid #c5a880; transform: translateX(6px); }
        .content-window { background-color: #131117; border: 2px solid #c5a880; border-radius: 6px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); box-sizing: border-box; flex: 1; max-width: 880px; width: 100%; min-height: 460px; }
        .window-title { font-family: 'Cinzel', serif; font-size: 26px; color: #c5a880; border-bottom: 1px solid #36303d; padding-bottom: 15px; margin-top: 0; margin-bottom: 25px; letter-spacing: 1px; }
    </style>
</head>

    <div class="header-bar"><div class="logo-text">JEOGORI RPG</div><a href="https://youtube.com" target="_blank" class="youtube-btn">YOUTUBE 구독하기</a></div>
    <div class="main-container">
        <div class="menu-container">
            <a href="index.html" class="menu-item">🏰 메인 홈</a>

            <a href="deck.html" class="menu-item active">💎 조합 정보</a>
            <a href="system.html" class="menu-item">⚙️ 설정 및 시스템</a>
        </div>
        <div class="content-window">
            <h2 class="window-title">CRAFTING & COMBINATION</h2>
            <p style="font-size: 17px; font-weight: 700; color: #c5a880; margin-bottom: 15px;">장비 합성식 및 숨겨진 장비 아이템 레시피</p>
            <p style="font-size: 15px; color: #e3dec9; line-height: 1.8;">고급 무기 제작법, 유니크 룬 합성 규칙, 혹은 최적의 전략적 덱 조합 공략집 가이드라인을 깔끔하게 수록하는 독립된 크래프팅 공간입니다.</p>
        </div>
    </div>
    <div style="background-color: #0b0a0d; padding: 30px; border-top: 1px solid #36303d; color: #555861; font-size: 13px; margin-top: 100px;"><p>© 2026 JEOGORI GAMES. ALL RIGHTS RESERVED.</p></div>
