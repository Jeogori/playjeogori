<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Jeogori - 공식 홈페이지</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080a0e;
            --container-bg: #0b0e14;
            --text-color: #ffffff;
            --sub-text: #7e828d;
            --menu-bg: #000000;
            --menu-text: #ffffff;
            --border-color: rgba(255, 70, 85, 0.3);
            --shadow-color: rgba(255, 42, 59, 0.15);
        }

        [data-theme="light"] {
            --bg-color: #f5f6f9;
            --container-bg: #ffffff;
            --text-color: #11141a;
            --sub-text: #606570;
            --menu-bg: #11141a;
            --menu-text: #ffffff;
            --border-color: rgba(255, 70, 85, 0.6);
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 260px;
            margin-top: 50px;
            perspective: 800px;
        }

        .menu-item {
            background-color: var(--menu-bg);
            color: var(--menu-text);
            padding: 15px 30px;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            text-align: left;
            letter-spacing: 1px;
            transform: skewX(-20deg) rotateY(15deg);
            box-shadow: -8px 8px 0px rgba(255, 70, 85, 0.6);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-item:hover {
            transform: skewX(-20deg) rotateY(5deg) translate(4px, -4px);
            box-shadow: -12px 12px 0px #ff4655;
            background-color: #ff4655;
        }

        .menu-item span {
            display: inline-block;
            transform: skewX(20deg); 
        }

        /* 우측 상단 정렬을 위한 묶음 컨테이너 */
        .right-header-group {
            display: flex;
            align-items: center;
            gap: 25px; /* 버튼과 스위치 사이의 세련된 간격 */
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-switch {
            width: 60px;
            height: 30px;
            background-color: #ffffff;
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            border: 2px solid #ff4655;
            box-shadow: 0 0 10px rgba(255, 70, 85, 0.2);
            transition: all 0.3s ease;
        }

        .switch-handle {
            width: 22px;
            height: 22px;
            background-color: #0f1115;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            left: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] .switch-handle {
            left: 34px;
            background-color: #ff4655;
        }

        /* 우측 상단 미니 유튜브 버튼 호버 효과 추가 */
        .header-youtube-btn:hover {
            background-color: #ff2a3b !important;
            box-shadow: 0 0 15px rgba(255, 70, 85, 0.6) !important;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- 1. 상단 메뉴 헤더 영역 (유튜브 버튼을 스위치 옆으로 알잘딱하게 이동) -->
    <div style="background-color: var(--container-bg); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff4655; position: sticky; top: 0; z-index: 9999; transition: background-color 0.3s;">
        <div style="font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 900; color: #ff4655; letter-spacing: 3px;">JEOGORI GAMES</div>
        
        <!-- 오른쪽 묶음 레이아웃 -->
        <div class="right-header-group">
            <!-- 💡 요청하신 위치! 스위치 바로 왼쪽에 밀착 탑재된 유튜브 구독 버튼 -->
            <a href="https://youtube.com" target="_blank" class="header-youtube-btn" style="background-color: #ff4655; color: white; border: none; padding: 10px 22px; font-size: 14px; font-weight: 900; text-decoration: none; letter-spacing: 1px; border-radius: 4px; box-shadow: 0 4px 15px rgba(255, 70, 85, 0.3); transition: all 0.2s ease;">YOUTUBE 구독하기</a>
            
            <!-- 다크모드/라이트모드 스위치 구조 -->
            <div class="switch-container">
                <span style="font-size: 14px; font-weight: 700; color: var(--text-color); font-family: 'Noto Sans KR', sans-serif;">다크 모드</span>
                <div class="theme-switch" id="themeBtn" onclick="toggleTheme()">
                    <div class="switch-handle" id="switchHandle"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 메인 레이아웃 본문 구역 -->
    <div style="display: flex; max-width: 1400px; margin: 0 auto; padding: 50px 20px; gap: 80px; justify-content: center; align-items: flex-start; text-align: left;">
        
        <!-- 좌측 3D 메뉴 바 -->
        <div class="menu-container">
            <div class="menu-item" style="background-color: #ff4655; box-shadow: -8px 8px 0px #ece8e1;"><span>메뉴</span></div>
            <a href="#char-section" class="menu-item"><span>캐릭터 정보</span></a>
            <a href="#skill-section" class="menu-item"><span>스킬 정보</span></a>
            <a href="#deck-section" class="menu-item"><span>조합 정보</span></a>
            <a href="#child-section" class="menu-item"><span>설정 및 시스템</span></a>
        </div>

        <!-- 우측 메인 비주얼 및 미디어 플레이어 -->
        <div style="flex: 1; max-width: 900px;">
            <div style="padding: 120px 50px; background: linear-gradient(rgba(8, 10, 14, 0.4), var(--bg-color)), url('https://unsplash.com') no-repeat center center/cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 50px; position: relative;">
                <h1 style="font-family: 'Oswald', sans-serif; font-size: 72px; font-weight: 900; color: #ece8e1; margin: 0 0 10px 0; letter-spacing: 6px;">PLAY JEOGORI</h1>
                <p style="font-size: 20px; font-weight: 700; color: #ece8e1; line-height: 1.8; margin-bottom: 0;">전 세계 유저의 심장을 뛰게 할 차세대 하드코어 인디 RPG.</p>
            </div>

            <!-- 유튜브 미디어 배포 공간 -->
            <div id="media-zone" style="background-color: var(--container-bg); padding: 40px; border: 1px solid var(--border-color); box-shadow: 0 20px 50px var(--shadow-color); border-radius: 8px; transition: background-color 0.3s, border-color 0.3s;">
                <h2 style="font-family: 'Oswald', sans-serif; font-size: 32px; color: #ff4655; margin-top: 0; margin-bottom: 30px; letter-spacing: 2px;">DEVELOPER LOGS</h2>
                <div style="width: 100%; aspect-ratio: 16/9; background-color: #000; border-radius: 4px; overflow: hidden;">
                    <iframe width="100%" height="100%" src="https://youtube.com" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </div>
            </div>
        </div>

    </div>

    <!-- 3. 하단 카피라이트 -->
    <div style="background-color: var(--bg-color); padding: 30px; border-top: 1px solid rgba(255,255,255,0.05); color: #555861; font-size: 13px; margin-top: 100px;">
        <p>© 2026 JEOGORI GAMES. ALL RIGHTS RESERVED.</p>
    </div>

    <!-- 4. 클릭 시 작동하며 글자도 자동으로 변경해 주는 자바스크립트 시스템 -->
    <script>
        function toggleTheme() {
            const body = document.body;
            const themeText = document.querySelector('.switch-container span');
            
            if (!body.hasAttribute('data-theme') || body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                if (themeText) themeText.textContent = "라이트 모드";
            } else {
                body.setAttribute('data-theme', 'dark');
                if (themeText) themeText.textContent = "다크 모드";
            }
        }
    </script>
</body>
</html>
