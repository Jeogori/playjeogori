<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Jeogori - 공식 홈페이지</title>
</head>
<body style="background-color: #0f1115; color: #fff; text-align: center; font-family: 'Helvetica Neue', sans-serif; margin: 0; padding: 0; overflow-x: hidden;">

    <!-- 상단 내비게이션 바 -->
    <div style="background-color: #11141a; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232833; padding-left: 50px; padding-right: 50px;">
        <div style="font-size: 24px; font-weight: 900; color: #ff4655; letter-spacing: 2px;">JEOGORI GAMES</div>
        <div>
            <!-- 내 실제 유튜브 채널 주소를 href="" 안에 넣으세요 -->
            <a href="https://youtube.com" target="_blank" style="color: #ece8e1; text-decoration: none; font-size: 16px; font-weight: bold; margin-left: 20px; transition: 0.3s;">YOUTUBE</a>
            <a href="#community" style="color: #ece8e1; text-decoration: none; font-size: 16px; font-weight: bold; margin-left: 20px;">COMMUNITY</a>
        </div>
    </div>

    <!-- 메인 화면 배너 구역 -->
    <div style="padding-top: 150px; padding-bottom: 150px; background: linear-gradient(rgba(15, 17, 21, 0.6), #0f1115), url('https://unsplash.com') no-repeat center center/cover;">
        <h1 style="font-size: 64px; font-weight: 900; color: #ece8e1; margin-bottom: 10px; letter-spacing: 5px;">PLAY JEOGORI</h1>
        <p style="font-size: 22px; color: #7e828d; max-width: 600px; margin: 0 auto 40px auto; line-height: 1.6;">전 세계 유저들과 함께 즐기는 차세대 인디 RPG.<br>지금 공식 유튜브를 구독하고 최신 개발 소식을 만나보세요.</p>
        
        <!-- 버튼 구역 -->
        <div style="display: flex; justify-content: center; gap: 20px;">
            <!-- 내 유튜브 주소 넣기 -->
            <a href="https://youtube.com" target="_blank" style="background-color: #ff4655; color: white; border: none; padding: 18px 40px; font-size: 18px; font-weight: bold; text-decoration: none; cursor: pointer; letter-spacing: 1px; transition: 0.2s; box-shadow: 0 4px 15px rgba(255, 70, 85, 0.4);">유튜브 채널 구독하기</a>
            <button style="background-color: transparent; color: #ece8e1; border: 1px solid #383e4d; padding: 18px 40px; font-size: 18px; font-weight: bold; cursor: not-allowed; letter-spacing: 1px;">게임 다운로드 (SOON)</button>
        </div>
    </div>

    <!-- 유튜브 영상 임베드 구역 (내 채널 예고편 영상 주소로 변경 가능) -->
    <div style="background-color: #11141a; padding: 80px 20px; border-top: 1px solid #232833;">
        <h2 style="font-size: 32px; color: #ff4655; margin-bottom: 40px; font-weight: 800;">DEVELOPER LOGS</h2>
        <div style="max-width: 800px; margin: 0 auto; aspect-ratio: 16/9; background-color: #000; border: 1px solid #232833;">
            <!-- 유튜브 영상 퍼가기 아이프레임 (샘플 영상입니다) -->
            <iframe width="100%" height="100%" src="https://youtube.com/embed/e57wV8bTz70" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
